name: ExpenseFlow Quality & CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-and-build:
    name: Quality Gate & Build
    runs-on: ubuntu-latest

    env:
      NODE_ENV: test
      MONGODB_URI: mongodb://127.0.0.1:27017/expenseflow_test
      AUTH_SECRET: ci-test-secret-key-32-characters-long-1234567890
      NEXT_PUBLIC_APP_URL: http://localhost:3000

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Run TypeScript Typecheck
        run: pnpm typecheck

      - name: Run Vitest Unit & Security Test Suite
        run: pnpm test

      - name: Run Next.js Production Build
        run: pnpm build
